name: Desktop builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PixelIQResultGenerator.exe
          - os: ubuntu-latest
            artifact: PixelIQResultGenerator
          - os: macos-latest
            artifact: PixelIQResultGenerator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirments.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirments.txt pyinstaller

      - name: Run tests
        run: python manage.py test result_app

      - name: Build desktop app (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: desktop\build_windows.bat

      - name: Build desktop app (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x desktop/build.sh
          PYTHON="$(command -v python)" ./desktop/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelIQResultGenerator-${{ matrix.os }}
          path: dist/${{ matrix.artifact }}
